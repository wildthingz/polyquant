version: '3.8'

services:
  # 1. Database (TimescaleDB)
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: polyquant_db
    environment:
      - POSTGRES_USER=polyquant_user
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=polyquant
      # Allow host connections (needed for some setups)
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - polyquant_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyquant_user -d polyquant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 2. IB Gateway (Headless)
  ib_gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: polyquant_ibkr
    environment:
      - TWS_USERID=${IBKR_USERNAME}
      - TWS_PASSWORD=${IBKR_PASSWORD}
      - TRADING_MODE=${IBKR_TRADING_MODE:-paper}
      - VNC_SERVER_PASSWORD=password123
    ports:
      - "4002:4002"
      - "5900:5900"
    networks:
      - polyquant_net
    restart: unless-stopped

  # 3. C++ Engine (Build & Run)
  engine:
    build:
      context: .
      dockerfile: docker/cpp/Dockerfile
    container_name: polyquant_engine
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=polyquant_user
      - DB_PASSWORD=password123
      - DB_NAME=polyquant
    networks:
      - polyquant_net
    command: tail -f /dev/null

  # 4. Python ML Worker
  ml_worker:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: polyquant_ml
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=polyquant_user
      - DB_PASSWORD=password123
      - DB_NAME=polyquant
    networks:
      - polyquant_net
    command: tail -f /dev/null

volumes:
  postgres_data:

networks:
  polyquant_net:
    driver: bridge
